interface:
  display_name: "审核改动并更新版本"
  short_description: "自动审核改动并判级，升版时同步 README、重打包 EXE 并发布 GitHub Release"
  default_prompt: "使用 $review-and-bump-version 审核本次修改，先判断是否与软件有关；仅无关软件的改动可不升版，否则判定更新级别，按 vx.y.z 规则同步版本和 README、重新打包 EXE 并上传 GitHub Release，Release title 只能是 v1.0.0 形式的纯版本号。"
policy:
  allow_implicit_invocation: true
