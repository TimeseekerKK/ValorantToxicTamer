interface:
  display_name: "审核改动并更新版本"
  short_description: "审核改动并升版打包，main 发布正式 Release，Beta 发布预发布，标题为纯版本号"
  default_prompt: "使用 $review-and-bump-version 审核本次修改，先判断是否与软件有关；仅无关软件的改动可不升版，否则判定更新级别，按 vx.y.z 规则同步版本和 README、按来源分支推送并重新打包 EXE：main 发布正式 Release 并设为 Latest，Beta 发布预发布且不设为 Latest；Release title 只能是 v1.0.0 形式的纯版本号。"
policy:
  allow_implicit_invocation: true
